<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optimal Agent — Agent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --bg:#eef1f4; --surface:#fff; --surface-2:#f5f7f9; --fg:#1b2430; --muted:#5c6775; --faint:#8793a1;
  --line:#dce2e9; --line-soft:#e7ecf1; --accent:#2f5bea; --accent-fg:#fff;
  --good:#1a9d50; --good-s:#e2f2e9; --warn:#b2730a; --warn-s:#f7ecd8; --crit:#c23b3b; --crit-s:#f6e2e2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1f3a; --surface:#0f2847; --surface-2:#0d2140; --fg:#e6edf5; --muted:#8a97a6; --faint:#5e6b7a;
  --line:#1e3a5f; --line-soft:#17304f; --accent:#5f82f2; --accent-fg:#071630;
  --good:#2ecb6b; --good-s:#123221; --warn:#e0a33a; --warn-s:#352711; --crit:#f0736f; --crit-s:#371717; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b1f3a; --surface:#0f2847; --surface-2:#0d2140; --fg:#e6edf5; --muted:#8a97a6; --faint:#5e6b7a;
  --line:#1e3a5f; --line-soft:#17304f; --accent:#5f82f2; --accent-fg:#071630;
  --good:#2ecb6b; --good-s:#123221; --warn:#e0a33a; --warn-s:#352711; --crit:#f0736f; --crit-s:#371717; color-scheme:dark;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%} [hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px}
.wrap{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:360px;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:0 8px 30px rgba(20,40,70,.10)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.brand img{width:40px;height:40px}
.brand b{font-weight:700;line-height:1.1} .brand small{display:block;color:var(--muted);font-size:.72rem}
h2{margin:14px 0 2px;font-size:1.1rem} .sub{color:var(--muted);font-size:.84rem;margin-bottom:10px}
label{font-size:.78rem;color:var(--muted);display:block;margin:10px 0 4px;font-weight:600}
input{width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:9px;padding:10px 12px;font:inherit}
.btn{width:100%;background:var(--accent);color:var(--accent-fg);border:0;border-radius:9px;padding:11px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}
.btn.ghost{background:var(--surface-2);color:var(--muted);border:1px solid var(--line);font-weight:600}
.err{background:var(--crit-s);color:var(--crit);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);border-radius:9px;padding:9px 11px;font-size:.82rem;margin-top:10px}
.ok{background:var(--good-s);color:var(--good);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);border-radius:9px;padding:9px 11px;font-size:.82rem;margin-top:10px}
.hint{color:var(--muted);font-size:.76rem;margin-top:8px}
.setup{background:var(--warn-s);color:var(--warn);border-radius:9px;padding:10px;font-size:.78rem;margin-top:10px}
/* home */
.home{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.ava-lg{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;font-size:1.3rem;font-weight:700;background-size:cover;background-position:center;overflow:hidden}
.pill{font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.row{display:flex;gap:8px;width:100%}
.theme-sw{position:fixed;top:12px;right:12px;display:inline-flex;gap:3px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.theme-sw button{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:3px 8px;font:inherit;font-size:.9rem;cursor:pointer}
.theme-sw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
</style>
</head>
<body>
<div class="theme-sw" id="theme-sw" role="group" aria-label="Theme"><button type="button" data-t="light" title="Light">☀</button><button type="button" data-t="dark" title="Dark">☾</button><button type="button" data-t="system" title="System">◐</button></div>
<div class="wrap">
  <div class="card">
    <div class="brand"><img src="logo.svg" alt="Optimal Agent"><div><b>Optimal Agent</b><small>Agent portal</small></div></div>

    <!-- sign in -->
    <form id="v-login">
      <h2>Sign in</h2>
      <div class="sub">Use the email and one-time password from your supervisor.</div>
      <div class="setup" id="setup-note" hidden>Supabase isn't configured in <b>lib/supabase-config.js</b>.</div>
      <label for="lg-email">Email</label><input id="lg-email" type="email" autocomplete="username" required>
      <label for="lg-pass">Password</label><input id="lg-pass" type="password" autocomplete="current-password" required>
      <div class="err" id="lg-err" hidden></div>
      <button class="btn" type="submit">Sign in</button>
      <div class="hint" style="text-align:center;margin-top:12px;font-size:.68rem">Powered By Log-Horizon BS, 2026 All Rights Reserved</div>
    </form>

    <!-- forced first-login password change -->
    <form id="v-change" hidden>
      <h2>Set your password</h2>
      <div class="sub">First login — please choose a new password.</div>
      <label for="np1">New password</label><input id="np1" type="password" autocomplete="new-password" required>
      <label for="np2">Confirm new password</label><input id="np2" type="password" autocomplete="new-password" required>
      <div class="err" id="np-err" hidden></div>
      <button class="btn" type="submit">Save new password</button>
    </form>

    <!-- signed-in home -->
    <div id="v-home" class="home" hidden>
      <span class="ava-lg" id="hm-ava"></span>
      <div><div style="font-weight:700;font-size:1.05rem" id="hm-name"></div><div class="hint" id="hm-id"></div></div>
      <span class="pill" id="hm-role">Agent</span>
      <div style="width:100%">
        <div class="hint" style="text-align:left;margin-bottom:6px">Today</div>
        <div id="stats" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div>
        <div id="target-bar" style="margin-top:10px"></div>
      </div>
      <div class="att" id="att-card" style="width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center">
        <div id="att-state" class="hint" style="margin-bottom:10px">—</div>
        <button class="btn" id="att-btn" style="margin-top:0">Check in</button>
      </div>
      <div style="width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px">
        <div style="font-weight:600;font-size:.9rem;margin-bottom:8px">Support</div>
        <div id="sup-msgs" style="display:flex;flex-direction:column;gap:6px;max-height:180px;overflow:auto;margin-bottom:8px"></div>
        <div style="display:flex;gap:8px"><input id="sup-input" placeholder="Message support…" style="flex:1"><button class="btn" id="sup-send" style="margin-top:0;width:auto;padding:0 16px">Send</button></div>
      </div>
      <div class="row">
        <button class="btn ghost" id="hm-change" style="margin-top:0">Change password</button>
        <button class="btn" id="hm-out" style="margin-top:0">Sign out</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './lib/supabase-config.js';
import { summarizeActivity, settleShift } from './lib/core/billing.mjs';
const $=(id)=>document.getElementById(id);
$('setup-note').hidden = !SUPABASE_URL.includes('YOUR-PROJECT-REF');
// Separate session store from the admin portal (same origin) so an admin login
// here doesn't bleed into the agent portal and vice-versa.
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ storageKey:'lh-agent-auth', persistSession:true, autoRefreshToken:true } });
const initials=(n)=>(n||'').split(/\s+/).map(w=>w[0]||'').join('').slice(0,2).toUpperCase();

/* theme */
function applyTheme(t){ if(t==='system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('#theme-sw button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===t))); }
(function(){ let t='system'; try{t=localStorage.getItem('lh-theme')||'system';}catch(e){} applyTheme(t);
  document.querySelectorAll('#theme-sw button').forEach(b=>b.addEventListener('click',()=>{ try{localStorage.setItem('lh-theme',b.dataset.t);}catch(e){} applyTheme(b.dataset.t); })); })();

function show(view){ ['v-login','v-change','v-home'].forEach(v=>$(v).hidden = v!==view); }

async function route(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user){ show('v-login'); return; }
  const md = user.user_metadata || {};
  if(md.must_change_password){ show('v-change'); return; }
  // home
  const name = md.name || user.email;
  $('hm-name').textContent = name;
  $('hm-id').textContent = md.agent_id ? ('Agent ID: '+md.agent_id) : user.email;
  $('hm-role').textContent = (md.role||'Agent');
  const av=md.avatar; if(av){ $('hm-ava').style.backgroundImage=`url("${av}")`; $('hm-ava').textContent=''; } else $('hm-ava').textContent=initials(name);
  show('v-home');
  ME_AGENT = md.agent_id || null;
  loadAttendance();
  initSupport();
  loadMyStats();
  if(!window._statsTimer) window._statsTimer = setInterval(loadMyStats, 60000);
}

/* ---- my stats (today) ---- */
const fmtH=(ms)=>{ const m=Math.round((ms||0)/60000); return Math.floor(m/60)+'h '+(m%60)+'m'; };
function statTile(label,val){ return `<div style="background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center"><div style="font-weight:700;font-size:1.05rem">${val}</div><div class="hint">${label}</div></div>`; }
async function loadMyStats(){
  if(!ME_AGENT) return;
  const dayStart=+new Date(new Date().toISOString().slice(0,10)+'T00:00:00'); const dayEnd=Math.min(Date.now(), dayStart+86400000);
  const { data } = await sb.from('events').select('type,server_ts,payload').eq('agent_id',ME_AGENT)
    .in('type',['status_change','transfer_confirmed','disposition','idle_start','idle_end'])
    .gte('server_ts',dayStart).lt('server_ts',dayEnd).limit(100000);
  const evs=(data||[]).map(r=>({ agentId:ME_AGENT, type:r.type, serverTs:r.server_ts, payload:r.payload||{} }));
  const s=summarizeActivity(evs,{windowStart:dayStart,windowEnd:dayEnd,idleGraceMs:180000});
  let target=0; try{ const r=await sb.rpc('my_agent_target'); target=r.data||0; }catch(e){}
  const paidHrs = target>0 ? settleShift({hourlyTarget:target,confirmedTransfers:s.paidTransfers,billableHoursWorked:s.dialingHours}).paidHours : null;
  $('stats').innerHTML = statTile('Dialing',fmtH(s.dialingMs))+statTile('Break',fmtH(s.pauseMs))+statTile('Calls',s.calls)
    + statTile('Transfers',s.paidTransfers)+statTile('Target /hr',target||'—')+statTile('Paid hrs', paidHrs===null?'—':paidHrs);
  if(target>0){
    const needed=Math.round(target*s.dialingHours); const pct=needed>0?Math.min(100,Math.round(s.paidTransfers/needed*100)):0;
    $('target-bar').innerHTML=`<div class="hint" style="text-align:left;margin-bottom:4px">Target progress — <b>${s.paidTransfers}/${needed}</b> transfers for ${fmtH(s.dialingMs)} dialed (${pct}%)</div>`+
      `<div style="height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent)"></div></div>`;
  } else $('target-bar').innerHTML='';
}

/* ---- support chat (agent <-> admin) ---- */
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let supSubbed=false;
async function loadSupportThread(){
  if(!ME_AGENT) return;
  const { data } = await sb.from('support_messages').select('sender,user_name,body,created_at')
    .eq('agent_id',ME_AGENT).order('created_at',{ascending:true}).limit(500);
  const box=$('sup-msgs');
  box.innerHTML=(data||[]).map(m=>{
    const admin=m.sender==='admin';
    return `<div style="align-self:${admin?'flex-end':'flex-start'};max-width:82%;background:${admin?'var(--accent)':'var(--surface)'};color:${admin?'var(--accent-fg)':'var(--fg)'};border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.84rem">${esc(m.body)}<div style="font-size:.6rem;opacity:.7;margin-top:2px">${admin?esc(m.user_name||'Support'):'You'}</div></div>`;
  }).join('')||'<div class="hint">No messages yet. Send one to reach your supervisor.</div>';
  box.scrollTop=box.scrollHeight;
}
async function sendSupport(){
  const text=$('sup-input').value.trim(); if(!text||!ME_AGENT) return;
  $('sup-input').value='';
  const { error } = await sb.from('support_messages').insert({ agent_id:ME_AGENT, sender:'agent', body:text });
  if(error){ $('sup-input').value=text; return; }
  loadSupportThread();
}
function initSupport(){
  loadSupportThread();
  if(!supSubbed && ME_AGENT){ supSubbed=true;
    sb.channel('sup-'+ME_AGENT).on('postgres_changes',{event:'INSERT',schema:'public',table:'support_messages',filter:'agent_id=eq.'+ME_AGENT},()=>loadSupportThread()).subscribe();
  }
}
$('sup-send').addEventListener('click', sendSupport);
$('sup-input').addEventListener('keydown',e=>{ if(e.key==='Enter') sendSupport(); });

/* ---- attendance: check in / check out ---- */
let ME_AGENT = null, attState = 'out';
const hhmm = (d)=> new Date(d).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
async function loadAttendance(){
  if(!ME_AGENT){ $('att-card').hidden = true; return; }
  $('att-card').hidden = false;
  const todayStart = +new Date(new Date().toISOString().slice(0,10)+'T00:00:00');
  const { data } = await sb.from('attendance').select('type,ts')
    .eq('agent_id', ME_AGENT).gte('ts', new Date(todayStart).toISOString())
    .order('ts', { ascending:false }).limit(1);
  const last = data && data[0];
  attState = (last && last.type==='check_in') ? 'in' : 'out';
  if(attState==='in'){ $('att-state').innerHTML = '🟢 Checked in at <b>'+hhmm(last.ts)+'</b>'; $('att-btn').textContent='Check out'; $('att-btn').classList.remove('ghost'); }
  else { $('att-state').textContent = last ? ('Last checked out at '+hhmm(last.ts)) : 'Not checked in today'; $('att-btn').textContent='Check in'; }
}
$('att-btn').addEventListener('click', async ()=>{
  if(!ME_AGENT) return;
  const type = attState==='in' ? 'check_out' : 'check_in';
  $('att-btn').disabled = true;
  const { error } = await sb.from('attendance').insert({ agent_id: ME_AGENT, type });
  $('att-btn').disabled = false;
  if(error){ $('att-state').textContent = error.message; return; }
  loadAttendance();
});

$('v-login').addEventListener('submit', async (e)=>{ e.preventDefault(); $('lg-err').hidden=true;
  const { error } = await sb.auth.signInWithPassword({ email:$('lg-email').value.trim(), password:$('lg-pass').value });
  if(error){ $('lg-err').textContent=error.message; $('lg-err').hidden=false; return; }
  route();
});

$('v-change').addEventListener('submit', async (e)=>{ e.preventDefault(); $('np-err').hidden=true;
  const p1=$('np1').value, p2=$('np2').value;
  if(p1.length<8){ $('np-err').textContent='Use at least 8 characters.'; $('np-err').hidden=false; return; }
  if(p1!==p2){ $('np-err').textContent='Passwords do not match.'; $('np-err').hidden=false; return; }
  const { data:{ user } } = await sb.auth.getUser();
  const md = { ...(user?.user_metadata||{}) }; delete md.must_change_password;
  const { error } = await sb.auth.updateUser({ password:p1, data:{ ...md, must_change_password:false } });
  if(error){ $('np-err').textContent=error.message; $('np-err').hidden=false; return; }
  $('np1').value=''; $('np2').value=''; route();
});

$('hm-out').addEventListener('click', async ()=>{ await sb.auth.signOut(); location.reload(); });
$('hm-change').addEventListener('click', ()=>{ show('v-change'); });

route();
</script>
</body>
</html>
